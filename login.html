<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Hashir Emadi</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      color: white;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      padding: 35px;
      border: 1px solid #222;
      border-radius: 20px;
      background: #0d0d0d;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #333;
      border-radius: 10px;
      outline: none;
      background: #151515;
      color: white;
    }

    input:focus {
      border-color: #fff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #status {
      text-align: center;
      margin-top: 18px;
      color: #aaa;
      min-height: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #777;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: white;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      Hashir Emadi
    </div>

    <div class="subtitle">
      Portfolio Admin
    </div>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <p id="status"></p>

    <a href="../index.html" class="back">
      ← Back to Portfolio
    </a>

  </div>

  <script type="module">

    import {
      getAuth,
      signInWithEmailAndPassword
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import { app } from "../js/firebase.js";

    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      status.textContent = "Logging in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        status.textContent = "Login successful!";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);

      } catch (error) {

        console.error(error);

        status.textContent =
          "Invalid email or password.";

      }

    });

  </script>

</body>
</html>
