<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hashir Emadi — Full Stack Developer, UI/UX Designer, AI Engineer</title>
<meta name="description" content="Portfolio of Hashir Emadi — Full Stack Developer, UI/UX Designer and AI Engineer specializing in React, Next.js, Node.js, Firebase and AI-powered web applications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230D0D0D%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22%23FF2D2D%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22bold%22>H</text></svg>">

<style>
/* ============ TOKENS ============ */
:root{
  --bg: #0D0D0D;
  --bg-alt: #131313;
  --surface: rgba(255,255,255,0.045);
  --surface-strong: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.10);
  --red: #FF2D2D;
  --red-deep: #8A0B0B;
  --white: #F5F4F2;
  --muted: #9A9A9A;
  --muted-2: #6E6E6E;
  --font-display: 'Anton', sans-serif;
  --font-body: 'Space Grotesk', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --ease: cubic-bezier(.16,.84,.44,1);
  --container: 1280px;
}
[data-theme="light"]{
  --bg: #F3F1EC;
  --bg-alt: #EAE7DF;
  --surface: rgba(13,13,13,0.04);
  --surface-strong: rgba(13,13,13,0.07);
  --border: rgba(13,13,13,0.12);
  --white: #121212;
  --muted: #55524c;
  --muted-2: #7a766d;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--white);
  font-family:var(--font-body);
  overflow-x:hidden;
  transition:background .5s var(--ease), color .5s var(--ease);
  cursor:none;
}
::selection{background:var(--red);color:#fff;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:none;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;}
.container{max-width:var(--container);margin:0 auto;padding:0 clamp(24px,5vw,64px);}
.eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--red);
  display:flex;align-items:center;gap:10px;
  margin-bottom:18px;
}
.eyebrow::before{content:'';width:24px;height:1px;background:var(--red);}
.section{padding:160px 0;position:relative;}
@media(max-width:768px){.section{padding:100px 0;}}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:0.01em;text-transform:uppercase;line-height:0.95;}
.section-title{font-size:clamp(36px,6vw,72px);margin-bottom:24px;}
.section-sub{color:var(--muted);font-size:16px;max-width:520px;line-height:1.6;font-weight:300;}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}
}

/* ============ CUSTOM CURSOR ============ */
.cursor-dot,.cursor-glow{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;transform:translate(-50%,-50%);}
.cursor-dot{width:6px;height:6px;background:var(--red);transition:transform .15s var(--ease);}
.cursor-glow{width:340px;height:340px;background:radial-gradient(circle,rgba(255,45,45,0.13) 0%,rgba(255,45,45,0) 70%);transition:transform .35s var(--ease),width .3s,height .3s;}
.cursor-glow.big{width:520px;height:520px;}
@media(max-width:900px){.cursor-dot,.cursor-glow{display:none;}body,button,a{cursor:auto;}}

/* ============ LOADER ============ */
#loader{position:fixed;inset:0;background:var(--bg);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;}
#loader .word{font-family:var(--font-display);font-size:clamp(40px,8vw,110px);color:var(--white);letter-spacing:0.02em;display:flex;overflow:hidden;}
#loader .word span{display:inline-block;transform:translateY(110%);animation:loadUp .7s var(--ease) forwards;}
#loader .word span:nth-child(1){animation-delay:.05s;color:var(--red);}
#loader .bar{width:220px;height:2px;background:var(--border);position:relative;overflow:hidden;}
#loader .bar::after{content:'';position:absolute;left:0;top:0;height:100%;width:0%;background:var(--red);animation:loadBar 1.6s var(--ease) forwards .3s;}
#loader .pct{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.2em;}
@keyframes loadUp{to{transform:translateY(0);}}
@keyframes loadBar{to{width:100%;}}
#loader.hide{animation:fadeOutLoader .7s var(--ease) forwards;}
@keyframes fadeOutLoader{to{opacity:0;visibility:hidden;}}

/* ============ SCROLL PROGRESS ============ */
#progress{position:fixed;top:0;left:0;height:2px;background:var(--red);z-index:9998;width:0%;box-shadow:0 0 12px var(--red);}

/* ============ NAVBAR ============ */
header{
  position:fixed;top:0;left:0;right:0;z-index:900;
  padding:22px 0;transition:padding .4s var(--ease),background .4s var(--ease),border-color .4s var(--ease);
  border-bottom:1px solid transparent;
}
header.scrolled{
  padding:14px 0;
  background:rgba(13,13,13,0.55);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--border);
}
[data-theme="light"] header.scrolled{background:rgba(243,241,236,0.6);}
nav{display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:var(--font-display);font-size:20px;letter-spacing:.05em;text-transform:uppercase;}
.logo span{color:var(--red);}
.nav-links{display:flex;gap:38px;list-style:none;}
.nav-links a{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);position:relative;padding:4px 0;transition:color .3s;}
.nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--red);transition:width .35s var(--ease);}
.nav-links a:hover,.nav-links a.active{color:var(--white);}
.nav-links a:hover::after,.nav-links a.active::after{width:100%;}
.nav-actions{display:flex;align-items:center;gap:18px;}
.theme-toggle{width:42px;height:42px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:border-color .3s,transform .3s;}
.theme-toggle:hover{border-color:var(--red);transform:rotate(20deg);}
.burger{display:none;flex-direction:column;gap:5px;width:26px;}
.burger span{height:1px;background:var(--white);transition:.3s;}
@media(max-width:860px){
  .nav-links{position:fixed;top:0;right:0;height:100vh;width:min(80vw,340px);background:var(--bg-alt);flex-direction:column;justify-content:center;align-items:flex-start;padding:40px;gap:26px;transform:translateX(100%);transition:transform .5s var(--ease);border-left:1px solid var(--border);}
  .nav-links.open{transform:translateX(0);}
  .burger{display:flex;}
}

/* ============ BUTTONS ============ */
.btn{
  position:relative;display:inline-flex;align-items:center;gap:10px;
  padding:16px 34px;font-family:var(--font-mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;
  border-radius:100px;overflow:hidden;isolation:isolate;transition:transform .4s var(--ease),box-shadow .4s var(--ease);
}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{box-shadow:0 0 34px rgba(255,45,45,.55);transform:translateY(-2px);}
.btn-ghost{border:1px solid var(--border);color:var(--white);}
.btn-ghost:hover{border-color:var(--red);background:rgba(255,45,45,.06);}
.btn-sm{padding:11px 22px;font-size:11px;}
.magnetic{will-change:transform;}

/* ============ HERO ============ */
.hero{
  position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;
  padding-top:120px;
}
.hero-bgtype{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);
  font-family:var(--font-display);font-size:clamp(90px,22vw,340px);
  color:transparent;-webkit-text-stroke:1.5px rgba(255,45,45,0.35);
  white-space:nowrap;user-select:none;z-index:0;letter-spacing:0.02em;
  mix-blend-mode:screen;
}
[data-theme="light"] .hero-bgtype{-webkit-text-stroke:1.5px rgba(255,45,45,0.28);mix-blend-mode:normal;}
.hero-bgtype .fill{
  position:absolute;inset:0;color:var(--red);opacity:.10;
  clip-path:polygon(0 0,0 0,0 100%,0 100%);
  animation:sweep 6s ease-in-out infinite;
}
@keyframes sweep{
  0%{clip-path:polygon(0 0,0 0,0 100%,0 100%);}
  50%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);}
  100%{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%);}
}
#hero-canvas{position:absolute;inset:0;z-index:1;opacity:.65;pointer-events:none;}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;width:100%;}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr;}}
.hero-left .eyebrow{margin-bottom:22px;}
.hero-title{font-size:clamp(40px,6vw,80px);margin-bottom:18px;}
.hero-title .accent{color:var(--red);}
.hero-roles{
  font-family:var(--font-mono);font-size:14px;color:var(--muted);letter-spacing:.05em;
  margin-bottom:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.hero-roles .dot{color:var(--red);}
.hero-desc{font-size:16px;line-height:1.75;color:var(--muted);max-width:520px;font-weight:300;margin-bottom:40px;}
.hero-desc b{color:var(--white);font-weight:500;}
.hero-cta{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:52px;}
.hero-stats{display:flex;gap:44px;flex-wrap:wrap;}
.hero-stats div{border-left:1px solid var(--border);padding-left:16px;}
.hero-stats .num{font-family:var(--font-display);font-size:30px;color:var(--white);}
.hero-stats .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;}

.hero-right{position:relative;display:flex;justify-content:center;}
.portrait-frame{
  position:relative;width:min(400px,90%);aspect-ratio:3/4;border-radius:18px;overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.7);
}
.portrait-frame::before{
  content:'';position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,rgba(13,13,13,0) 40%,rgba(13,13,13,.85) 100%);
}
.portrait-frame::after{
  content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), inset 0 -1px 40px rgba(255,45,45,.15);
}
.portrait-svg{position:absolute;inset:0;width:100%;height:100%;}
.portrait-vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 90% at 78% 8%, rgba(255,45,45,.22), transparent 55%),
    radial-gradient(140% 120% at 15% 100%, rgba(0,0,0,.75), transparent 60%),
    radial-gradient(160% 140% at 50% 50%, transparent 40%, rgba(13,13,13,.55) 100%);
}
.portrait-caption{position:absolute;z-index:4;bottom:22px;left:22px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:#fff;text-transform:uppercase;}
.portrait-caption .r{color:var(--red);}
.portrait-glow{position:absolute;width:70%;height:70%;background:radial-gradient(circle,rgba(255,45,45,.35),transparent 70%);filter:blur(60px);z-index:0;top:10%;right:5%;}
.portrait-badge{
  position:absolute;top:22px;right:-14px;z-index:5;background:var(--red);color:#fff;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;padding:10px 16px;border-radius:100px;
  display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(255,45,45,.4);
}
.portrait-badge .pulse{width:6px;height:6px;background:#fff;border-radius:50%;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.scroll-cue{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;}
.scroll-cue .line{width:1px;height:46px;background:linear-gradient(var(--red),transparent);animation:scrollcue 2s infinite;}
@keyframes scrollcue{0%{transform:scaleY(0);transform-origin:top;}50%{transform:scaleY(1);transform-origin:top;}51%{transform-origin:bottom;}100%{transform:scaleY(0);transform-origin:bottom;}}
.scroll-cue span{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}

/* ============ REVEAL ============ */
.reveal{opacity:0;transform:translateY(50px);transition:opacity 1s var(--ease),transform 1s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}
.stagger > *{transition-delay:calc(var(--i) * 90ms);}

/* ============ PROJECTS ============ */
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:70px;flex-wrap:wrap;}
.projects-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;}
@media(max-width:900px){.projects-grid{grid-template-columns:1fr;}}
.project-card{
  position:relative;border-radius:20px;background:var(--surface);border:1px solid var(--border);
  overflow:hidden;padding:0;transition:transform .55s var(--ease),border-color .4s;
  backdrop-filter:blur(14px);
}
.project-card:hover{transform:translateY(-8px);border-color:rgba(255,45,45,.4);}
.project-media{position:relative;aspect-ratio:16/10;overflow:hidden;}
.project-media .mock{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  transition:transform .8s var(--ease);
}
.project-card:hover .project-media .mock{transform:scale(1.08);}
.project-media::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,13,0) 50%,var(--bg) 130%);opacity:.6;}
.project-tag{position:absolute;top:16px;left:16px;z-index:2;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:#fff;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);padding:6px 12px;border-radius:100px;border:1px solid rgba(255,255,255,.15);text-transform:uppercase;}
.project-num{position:absolute;top:16px;right:20px;z-index:2;font-family:var(--font-display);font-size:34px;color:rgba(255,255,255,.18);}
.project-body{padding:30px 30px 32px;}
.project-title{font-family:var(--font-display);font-size:24px;text-transform:uppercase;margin-bottom:10px;letter-spacing:.01em;}
.project-desc{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:20px;font-weight:300;}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
.badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;padding:6px 12px;border:1px solid var(--border);border-radius:100px;color:var(--muted);text-transform:uppercase;transition:.3s;}
.project-card:hover .badge{border-color:rgba(255,45,45,.25);color:var(--white);}
.project-actions{display:flex;gap:12px;}

/* ============ SKILLS ============ */
.skills-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
@media(max-width:980px){.skills-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.skills-grid{grid-template-columns:1fr;}}
.skill-card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px 26px;
  transition:transform .5s var(--ease),border-color .4s,background .4s;backdrop-filter:blur(14px);
}
.skill-card:hover{transform:translateY(-6px);border-color:rgba(255,45,45,.35);background:var(--surface-strong);}
.skill-card .cat{font-family:var(--font-mono);font-size:11px;letter-spacing:.15em;color:var(--red);text-transform:uppercase;margin-bottom:20px;display:block;}
.skill-list{list-style:none;display:flex;flex-direction:column;gap:14px;}
.skill-list li{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--white);font-weight:300;}
.skill-list li .ic{width:8px;height:8px;border-radius:50%;background:var(--border);position:relative;flex:none;transition:.4s;}
.skill-card:hover .skill-list li .ic{background:var(--red);box-shadow:0 0 10px var(--red);}

/* ============ TIMELINE ============ */
.timeline{position:relative;margin-top:40px;}
.timeline-line{position:absolute;left:29px;top:0;bottom:0;width:1px;background:var(--border);}
.timeline-fill{position:absolute;left:29px;top:0;width:1px;background:var(--red);height:0%;box-shadow:0 0 12px var(--red);transition:height .2s linear;}
.t-item{position:relative;padding:0 0 64px 84px;}
.t-item:last-child{padding-bottom:0;}
.t-dot{position:absolute;left:18px;top:2px;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;transition:.5s var(--ease);}
.t-item.in .t-dot{border-color:var(--red);box-shadow:0 0 22px rgba(255,45,45,.6);}
.t-dot .core{width:6px;height:6px;border-radius:50%;background:var(--muted-2);transition:.5s;}
.t-item.in .t-dot .core{background:var(--red);}
.t-num{font-family:var(--font-mono);font-size:12px;color:var(--red);letter-spacing:.1em;margin-bottom:8px;}
.t-title{font-family:var(--font-display);font-size:26px;text-transform:uppercase;margin-bottom:8px;}
.t-desc{color:var(--muted);font-size:14px;max-width:460px;line-height:1.7;font-weight:300;}

/* ============ COUNTERS ============ */
.stats-band{
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:80px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:30px;
}
@media(max-width:860px){.stats-band{grid-template-columns:repeat(2,1fr);}}
.stat{text-align:left;}
.stat .count{font-family:var(--font-display);font-size:clamp(46px,6vw,72px);color:var(--white);display:flex;align-items:baseline;gap:4px;}
.stat .count .plus{color:var(--red);}
.stat .stat-lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px;}

/* ============ TESTIMONIALS ============ */
.test-track-wrap{overflow:hidden;margin-top:20px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);}
.test-track{display:flex;gap:24px;width:max-content;animation:scrollTest 42s linear infinite;}
.test-track-wrap:hover .test-track{animation-play-state:paused;}
@keyframes scrollTest{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.t-card{
  width:380px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;
  backdrop-filter:blur(14px);
}
.t-card .stars{color:var(--red);font-size:13px;letter-spacing:2px;margin-bottom:18px;}
.t-card p{font-size:15px;line-height:1.75;color:var(--white);font-weight:300;margin-bottom:26px;min-height:110px;}
.t-person{display:flex;align-items:center;gap:14px;}
.t-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;color:#fff;flex:none;}
.t-person .name{font-size:14px;color:var(--white);}
.t-person .role{font-family:var(--font-mono);font-size:11px;color:var(--muted);}

/* ============ CONTACT ============ */
contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;}
@media(max-width:900px){.contact-grid{grid-template-columns:1fr;}}
.contact-info .big{font-family:var(--font-display);font-size:clamp(30px,4vw,44px);text-transform:uppercase;margin:20px 0 30px;line-height:1.05;}
.contact-detail{display:flex;flex-direction:column;gap:20px;margin-bottom:40px;}
.contact-detail a{font-size:15px;color:var(--white);border-bottom:1px solid var(--border);padding-bottom:14px;transition:.3s;display:flex;justify-content:space-between;}
.contact-detail a:hover{color:var(--red);border-color:var(--red);}
.social-row{display:flex;gap:14px;}
.social-row a{width:46px;height:46px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.35s var(--ease);}
.social-row a:hover{border-color:var(--red);background:var(--red);transform:translateY(-4px);}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:22p
